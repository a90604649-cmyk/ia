name: Fix DeepSeek JSON parser

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-deepseek:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch deepseek.js robustly
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('ia/deepseek.js')
          text = path.read_text(encoding='utf-8')

          parser = '''function limpiarJsonMarkdown(texto) {
              return String(texto || "")
                  .trim()
                  .replace(/^```json\\s*/i, "")
                  .replace(/^```\\s*/i, "")
                  .replace(/\\s*```$/i, "")
                  .trim();
          }

          function extraerObjetoJson(texto) {
              const limpio = limpiarJsonMarkdown(texto);
              const inicio = limpio.indexOf("{");

              if (inicio === -1) {
                  return null;
              }

              let profundidad = 0;
              let dentroDeString = false;
              let escapado = false;

              for (let i = inicio; i < limpio.length; i++) {
                  const caracter = limpio[i];

                  if (dentroDeString) {
                      if (escapado) {
                          escapado = false;
                          continue;
                      }

                      if (caracter === "\\\\") {
                          escapado = true;
                          continue;
                      }

                      if (caracter === '"') {
                          dentroDeString = false;
                      }

                      continue;
                  }

                  if (caracter === '"') {
                      dentroDeString = true;
                      continue;
                  }

                  if (caracter === "{") {
                      profundidad += 1;
                      continue;
                  }

                  if (caracter === "}") {
                      profundidad -= 1;

                      if (profundidad === 0) {
                          return limpio.slice(inicio, i + 1);
                      }
                  }
              }

              return null;
          }

          function parsearJsonRobusto(texto) {
              const limpio = limpiarJsonMarkdown(texto);

              try {
                  return JSON.parse(limpio);
              } catch {
                  const objeto = extraerObjetoJson(limpio);
                  if (!objeto) return null;

                  try {
                      return JSON.parse(objeto);
                  } catch {
                      return null;
                  }
              }
          }

          function normalizarJsonRespuesta(texto) {
              const objeto = parsearJsonRobusto(texto);

              if (
                  !objeto ||
                  typeof objeto !== "object" ||
                  Array.isArray(objeto) ||
                  !Array.isArray(objeto.actions)
              ) {
                  return null;
              }

              if (typeof objeto.reply === "undefined") {
                  objeto.reply = "Sistema actualizado por DeepSeek.";
              }

              return JSON.stringify(objeto);
          }

          function esJsonInterpretable(texto) {
              return normalizarJsonRespuesta(texto) !== null;
          }'''

          start = text.find('function limpiarJsonMarkdown(texto) {')
          end = text.find('export async function preguntarDeepSeek', start)

          if start == -1 or end == -1:
              raise SystemExit('No se encontró el bloque del parser JSON')

          text = text[:start] + parser + '\n\n' + text[end:]

          response_block = '''            const texto = extraerTexto(resultado.data);
            const jsonNormalizado = normalizarJsonRespuesta(texto);

            if (!jsonNormalizado) {
                ultimoError = new Error(
                    "DeepSeek terminó la petición, pero la respuesta no contenía un JSON válido con actions."
                );

                console.warn(
                    `⚠️ La clave ${numeroClave} recibió una respuesta no interpretable.`
                );

                console.warn(
                    "🧾 Inicio de la respuesta recibida:",
                    String(texto).slice(0, 500).replace(/\\s+/g, " ")
                );

                if (indiceClave < claves.length - 1) {
                    console.warn("↪️ Probando la siguiente clave de OpenRouter...");
                    await sleep(500);
                    continue;
                }

                throw ultimoError;
            }

            console.log(
                `✅ DeepSeek respondió correctamente usando la clave ${numeroClave}/${claves.length}.`
            );

            return jsonNormalizado;'''

          pattern = re.compile(
              r'            const texto = extraerTexto\\(resultado\\.data\\);\\n.*?            return texto\\.trim\\(\\);',
              re.S,
          )

          text, count = pattern.subn(response_block, text, count=1)
          if count != 1:
              raise SystemExit('No se encontró el bloque de procesamiento de respuesta')

          extraer = '''function extraerTexto(data) {
              let texto =
                  data?.choices?.[0]?.message?.content ??
                  data?.choices?.[0]?.text ??
                  data?.output_text ??
                  "";

              if (Array.isArray(texto)) {
                  texto = texto
                      .map((parte) => {
                          if (typeof parte === "string") return parte;
                          return parte?.text || parte?.content || "";
                      })
                      .join("");
              }

              if (typeof texto !== "string" || !texto.trim()) {
                  const finishReason = data?.choices?.[0]?.finish_reason;
                  const usage = data?.usage?.completion_tokens_details;

                  if (finishReason === "length") {
                      throw new Error(
                          "DeepSeek agotó el límite de salida antes de terminar el JSON. " +
                          `Razonamiento usado: ${usage?.reasoning_tokens ?? "desconocido"} tokens.`
                      );
                  }

                  throw new Error(
                      `OpenRouter no devolvió contenido válido: ${obtenerErrorTexto(data)}`
                  );
              }

              return texto.trim();
          }

          export const DEEPSEEK_MODEL = OPENROUTER_MODEL;
          export { OPENROUTER_MODEL };'''

          start = text.find('function extraerTexto(data) {')
          end = text.find('export const DEEPSEEK_MODEL', start)
          if start == -1 or end == -1:
              raise SystemExit('No se encontró extraerTexto')

          text = text[:start] + extraer + '\n'
          path.write_text(text, encoding='utf-8')

          print('deepseek.js patched successfully')

      - name: Validate syntax
        run: node --check ia/deepseek.js

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ia/deepseek.js
          git rm .github/workflows/patch-deepseek-json.yml
          git commit -m "Robust DeepSeek JSON response parsing"
          git push
